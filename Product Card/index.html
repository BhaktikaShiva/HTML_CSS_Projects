<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="cart">
        <h2>My Cart</h2>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aGVhZHBob25lc3xlbnwwfHwwfHx8MA%3D%3D" alt="Headphones">

            <div class="product-info">
            <h3>Wireless Headphones</h3>
            <p class="price">$190</p>
            <p class="quantity">Quantity:1</p>
            </div>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1579586337278-3befd40fd17a?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8c21hcnQlMjB3YXRjaHxlbnwwfHwwfHx8MA%3D%3D" alt="smartwatch">

            <div class="product-info">
                <h3>Smart Watch</h3>
                <p class="price">$100</p>
                <p class="quantity">Quantity:1</p>
            </div>
        </div>

        <div class="total">
            total: $1000
        </div>

        <button class="checkout">Proceed to Checkout</button>
    </div>
</body>
</html>
